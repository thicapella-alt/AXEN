# /etc/nginx/sites-available/axen
# AXEN Intelligence — app.useaxen.com.br
#
# Habilitar:
#   sudo ln -s /etc/nginx/sites-available/axen /etc/nginx/sites-enabled/axen
#   sudo nginx -t && sudo systemctl reload nginx

# ── Redireciona HTTP → HTTPS ──────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name app.useaxen.com.br;

    # Certbot coloca este bloco automaticamente no setup.sh
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS + Basic Auth + Proxy ────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.useaxen.com.br;

    # SSL — preenchido automaticamente pelo Certbot
    ssl_certificate     /etc/letsencrypt/live/app.useaxen.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.useaxen.com.br/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Proteção Basic Auth — só você acessa
    auth_basic           "AXEN Intelligence — Acesso Restrito";
    auth_basic_user_file /etc/nginx/.htpasswd-axen;

    # Cabeçalhos de segurança
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy       "strict-origin" always;

    # ── Frontend (arquivos estáticos gerados pelo build do Vite) ──────────────
    root  /var/www/axen/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # Sem cache para o index.html (SPA entry point)
    location = /index.html {
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ── Callback OAuth do Mercado Livre — sem Basic Auth ──────────────────────
    # O Mercado Livre redireciona o navegador para esta rota após o login;
    # eventuais notificações/webhooks futuros também batem aqui diretamente
    # (servidor-a-servidor, sem credenciais de Basic Auth). Precisa ficar
    # acessível sem auth_basic, mesmo com o resto do domínio protegido.
    #
    # Regex (não prefixo) de propósito: um "location /api/auth/ml/ {}" com
    # barra no final acabava perdendo pra "location / {}" (SPA) sempre que o
    # request vinha SEM a barra (ex.: /api/auth/ml puro, que é como o link de
    # início da autorização é acessado) — nginx devolvia um 301 local juntando
    # a barra e o navegador saía do domínio /api de vez. Achado ao vivo em
    # produção na Fase 0 (item 0.2) — ver histórico do PR. A regex casa com
    # /api/auth/ml, /api/auth/ml/, /api/auth/ml/callback e /api/auth/ml/status
    # de uma vez, sem ambiguidade de barra.
    location ~ ^/api/auth/ml(/.*)?$ {
        auth_basic off;
        # $is_args$args preserva o ?code=... que o Mercado Livre manda no
        # callback — location por regex NÃO repassa a query string sozinha.
        proxy_pass         http://127.0.0.1:8001/auth/ml$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── API — proxy para uvicorn na porta 8001 ────────────────────────────────
    # /api/prices/ → http://127.0.0.1:8001/prices/  (strip do prefixo /api)
    location /api/ {
        proxy_pass         http://127.0.0.1:8001/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Logs separados do Tradebit
    access_log /var/log/nginx/axen-access.log;
    error_log  /var/log/nginx/axen-error.log;
}
